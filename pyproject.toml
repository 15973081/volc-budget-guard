[project]
name = "volc-budget-guard"
version = "0.1.0"
description = "Project-level cloud billing polling and budget enforcement"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "apscheduler>=3.10,<4",
  "python-dateutil>=2.9,<3",
  "typer>=0.12,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
budget-guard = "budget_guard.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
